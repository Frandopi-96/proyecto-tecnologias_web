<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Sala de exposiciones con tres cuadros en la pared -->
  <rect width="320" height="180" fill="#efe9df"/>
  <rect x="0" y="140" width="320" height="40" fill="#b9a68a"/>
  <!-- cuadro 1: mar -->
  <rect x="30" y="45" width="70" height="55" fill="#6b4f2a"/>
  <rect x="36" y="51" width="58" height="43" fill="#9fd3e6"/>
  <rect x="36" y="76" width="58" height="18" fill="#2f6f9f"/>
  <!-- cuadro 2: montaña -->
  <rect x="125" y="35" width="70" height="70" fill="#6b4f2a"/>
  <rect x="131" y="41" width="58" height="58" fill="#f7e2b5"/>
  <polygon points="134,96 158,58 186,96" fill="#5b8c5a"/>
  <circle cx="176" cy="54" r="7" fill="#e98a15"/>
  <!-- cuadro 3: abstracto -->
  <rect x="220" y="45" width="70" height="55" fill="#6b4f2a"/>
  <rect x="226" y="51" width="58" height="43" fill="#ffffff"/>
  <circle cx="246" cy="70" r="12" fill="#c0392b"/>
  <rect x="258" y="62" width="20" height="26" fill="#2c3e50"/>
</svg>
